name: Android preview and checks

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android/**', 'dist/**', 'check-*.cjs', '.github/workflows/android-build.yml']

permissions:
  contents: write

concurrency:
  group: android-preview
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify website and Android source
        run: |
          node check-engine.cjs
          node check-cardio.cjs
          node check-food-directory.cjs
          node check-athletes.cjs
          node check-vector.cjs
          node check-completion.cjs
          node check-android.cjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;34.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile and lint bundled application
        run: gradle -p android --no-daemon -PappVersionCode=${{ github.run_number }} -PappVersionName=0.1.${{ github.run_number }} :app:assembleDebug :app:lintDebug
      - name: Verify signed APK and package download
        run: |
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose android/app/build/outputs/apk/debug/app-debug.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk baoji-boji-android.apk
          sha256sum baoji-boji-android.apk > baoji-boji-android.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: baoji-boji-android
          path: |
            baoji-boji-android.apk
            baoji-boji-android.apk.sha256
          if-no-files-found: error
      - name: Publish installable Android preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "android-v0.1.${GITHUB_RUN_NUMBER}" baoji-boji-android.apk baoji-boji-android.apk.sha256 --target "$GITHUB_SHA" --title "暴击薄肌 Android 试用版 0.1.${GITHUB_RUN_NUMBER}" --notes "包含同版本网页、15个动作演示、主题训练计划、饮食目录、拍照/上传入口与本机记录。Android 8.0及以上。此包为调试签名试用版；已完成构建、Lint及APK签名校验，尚需真机验证。请保留现有本机记录，避免未经确认卸载旧版。" --latest
