name: Build Android preview
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android/**', 'dist/**', '.github/workflows/android-build.yml']
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;34.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Check source contract
        run: node check-android.cjs
      - name: Compile and lint bundled application
        run: gradle -p android --no-daemon -PappVersionCode=${{ github.run_number }} -PappVersionName=0.1.${{ github.run_number }} :app:assembleDebug :app:lintDebug
      - name: Stage installable preview
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Build-up-muscles-android-preview.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Build-up-muscles-android-preview
          path: Build-up-muscles-android-preview.apk
          if-no-files-found: error
